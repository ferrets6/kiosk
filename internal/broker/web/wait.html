<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiosk — avvio</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181a; --fg: #ececea; --muted: #9a9a95; --err: #f2b8b5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 28rem; padding: 0 16px; text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 1rem; border: 3px solid var(--muted); border-top-color: transparent;
          border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { color: var(--muted); }
  #err { color: var(--err); }
  button { font: inherit; padding: .4rem 1rem; }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <h1>Sto preparando il tuo browser</h1>
  <p id="msg">Di solito ci vogliono pochi secondi. La prima volta può volerci qualche minuto.</p>
  <p id="err" hidden></p>
  <button id="retry" hidden onclick="location.reload()">Riprova</button>
</main>
<script>
  async function poll() {
    try {
      const r = await fetch("/_kiosk/ready", { cache: "no-store" });
      const s = await r.json();
      if (s.ready) { location.reload(); return; }
      if (s.error) {
        document.getElementById("spin").hidden = true;
        document.getElementById("msg").hidden = true;
        const e = document.getElementById("err");
        e.textContent = s.error; e.hidden = false;
        document.getElementById("retry").hidden = false;
        return;
      }
    } catch (_) {}
    setTimeout(poll, 1500);
  }
  poll();
</script>
</body>
</html>
